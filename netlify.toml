[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["msedge-tts", "ws"]

# Route /api/* requests to the serverless TTS Netlify Function before the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/tts?route=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
